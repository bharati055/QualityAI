name: pack-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack integrity self-check
        run: python scripts/validate_pack.py --self-check
